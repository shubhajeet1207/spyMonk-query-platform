# GitLab CI/CD for SpyMonk-DB
# Tests every commit; builds and publishes the package from main/tags.

stages:
  - test
  - build
  - publish

# 0. Run the unit test suite on every commit
test_package:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e .[dev]
    - python -m pytest tests/unit -v
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# 1. Build the wheel and source distribution
build_package:
  stage: build
  image: python:3.12-slim
  script:
    - pip install build
    - python3 -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# 2. Upload to the GitLab Package Registry
# This job runs automatically on the 'main' branch or when a new tag is created.
publish_package:
  stage: publish
  image: python:3.12-slim
  dependencies:
    - build_package
  script:
    - pip install twine
    - |
      TWINE_PASSWORD=${CI_JOB_TOKEN} \
      TWINE_USERNAME=gitlab-ci-token \
      python3 -m twine upload \
        --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi \
        dist/*
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  environment:
    name: production
