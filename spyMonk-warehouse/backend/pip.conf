# Pip configuration for using private PyPI server
# Copy this file to ~/.pip/pip.conf or /etc/pip.conf

[global]
# Private PyPI server as additional index
# Replace with your actual server URL and credentials
extra-index-url = http://USERNAME:PASSWORD@your-pypi-server.com:8080/simple/

# For local development
# extra-index-url = http://spymonk:password@localhost:8080/simple/

# For Railway/production deployment
# extra-index-url = http://spymonk:password@pypi.yourcompany.com/simple/

# Trust the PyPI server
trusted-host = your-pypi-server.com
# trusted-host = localhost  # For local development

# Timeout settings
timeout = 60

[install]
# Prefer binary wheels
prefer-binary = true
