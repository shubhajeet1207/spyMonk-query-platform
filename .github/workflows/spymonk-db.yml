name: spyMonk-DB

# Mirrors spyMonk-DB/.gitlab-ci.yml: test -> build -> publish.

on:
  push:
    branches: [main]
    paths:
      - "spyMonk-DB/**"
      - ".github/workflows/spymonk-db.yml"
  pull_request:
    paths:
      - "spyMonk-DB/**"
      - ".github/workflows/spymonk-db.yml"

defaults:
  run:
    working-directory: spyMonk-DB

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (with dev extras)
        run: pip install -e .[dev]
      - name: Run unit tests
        run: python -m pytest tests/unit -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: spymonk-db-dist
          path: spyMonk-DB/dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spymonk-db-dist
          path: spyMonk-DB/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish to PyPI
        working-directory: spyMonk-DB
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set — skipping publish."
            echo "Add it under Settings > Secrets and variables > Actions to enable."
            exit 0
          fi
          pip install twine
          twine upload dist/*
