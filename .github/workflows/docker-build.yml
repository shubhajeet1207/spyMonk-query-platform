name: Docker build

# Builds the unified image (frontend + backend + spyMonk-DB) from the repo
# root, matching how it's actually deployed. On PRs this only validates the
# build; on pushes to main it also publishes to GHCR (uses the built-in
# GITHUB_TOKEN, so no extra secrets are needed).

on:
  push:
    branches: [main]
    paths:
      - "spyMonk-DB/**"
      - "spyMonk-warehouse/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "spyMonk-DB/**"
      - "spyMonk-warehouse/**"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: spyMonk-warehouse/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/spymonk-query-platform:latest
            ghcr.io/${{ github.repository_owner }}/spymonk-query-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
