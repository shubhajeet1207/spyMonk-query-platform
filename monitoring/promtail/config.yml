server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spymonk-warehouse-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: spymonk-warehouse-backend
          app: spymonk-warehouse
          service: spymonk-warehouse-backend
          container: spymonk-warehouse-backend
          component: backend
          environment: local
          __path__: /var/log/spymonk-warehouse/*.log
