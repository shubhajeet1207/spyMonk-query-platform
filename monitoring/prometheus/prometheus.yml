# Prometheus scrape config for the spyMonk stack.
#
# The warehouse app runs from docker-compose.yml (a separate compose project),
# so Prometheus reaches it via the host gateway rather than a shared network.
# The warehouse publishes :8000 on the host; host.docker.internal resolves to
# the host from inside the Prometheus container (see extra_hosts in the compose
# file). If you put both compose files on a shared network instead, change the
# target to "warehouse:8000".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: spymonk-warehouse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          app: spymonk-warehouse
          component: backend
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container resource metrics. cAdvisor runs in this same compose project,
  # so it is reachable by service name.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host-level resource metrics.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
