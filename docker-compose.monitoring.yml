services:
  loki:
    image: grafana/loki:3.3.2
    container_name: spymonk-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: spymonk-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./spyMonk-warehouse/backend/logs:/var/log/spymonk-warehouse:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: spymonk-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Lets the container resolve the host (where the warehouse publishes :8000).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Per-container resource metrics (CPU, memory, network, disk) for every
  # container on this Docker host, including spymonk-warehouse.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: spymonk-cadvisor
    ports:
      - "8081:8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Host-level resource metrics (CPU, memory, load, filesystem) of the Docker
  # host / VM that runs the stack.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: spymonk-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: spymonk-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
