<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spyMonk — distributed SQL engine and analytical warehouse">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#171136"/>
      <stop offset="100%" stop-color="#1c1033"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pcb" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0,20 H30 V50 H80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <path d="M50,0 V30 H80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="30" cy="50" r="1.4" fill="#ffffff" fill-opacity="0.09"/>
      <circle cx="50" cy="30" r="1.4" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#pcb)"/>
  <rect width="1200" height="4" fill="url(#topBar)"/>

  <!-- HUD-style corner brackets -->
  <g stroke-width="2" fill="none" stroke-opacity="0.55">
    <path d="M14,42 V14 H42" stroke="#22d3ee"/>
    <path d="M1158,14 H1186 V42" stroke="#8b5cf6"/>
    <path d="M14,278 V306 H42" stroke="#8b5cf6"/>
    <path d="M1186,278 V306 H1158" stroke="#22d3ee"/>
  </g>

  <!-- blueprint-style tick marks along the base -->
  <g stroke="#ffffff" stroke-opacity="0.08">
    <line x1="60" y1="316" x2="60" y2="310"/>
    <line x1="100" y1="316" x2="100" y2="310"/>
    <line x1="140" y1="316" x2="140" y2="310"/>
    <line x1="180" y1="316" x2="180" y2="310"/>
    <line x1="220" y1="316" x2="220" y2="310"/>
    <line x1="260" y1="316" x2="260" y2="310"/>
    <line x1="300" y1="316" x2="300" y2="310"/>
    <line x1="340" y1="316" x2="340" y2="310"/>
    <line x1="380" y1="316" x2="380" y2="310"/>
    <line x1="420" y1="316" x2="420" y2="310"/>
    <line x1="460" y1="316" x2="460" y2="310"/>
    <line x1="500" y1="316" x2="500" y2="310"/>
    <line x1="540" y1="316" x2="540" y2="310"/>
    <line x1="580" y1="316" x2="580" y2="310"/>
    <line x1="620" y1="316" x2="620" y2="310"/>
    <line x1="660" y1="316" x2="660" y2="310"/>
    <line x1="700" y1="316" x2="700" y2="310"/>
    <line x1="740" y1="316" x2="740" y2="310"/>
    <line x1="780" y1="316" x2="780" y2="310"/>
    <line x1="820" y1="316" x2="820" y2="310"/>
    <line x1="860" y1="316" x2="860" y2="310"/>
    <line x1="900" y1="316" x2="900" y2="310"/>
    <line x1="940" y1="316" x2="940" y2="310"/>
    <line x1="980" y1="316" x2="980" y2="310"/>
    <line x1="1020" y1="316" x2="1020" y2="310"/>
    <line x1="1060" y1="316" x2="1060" y2="310"/>
    <line x1="1100" y1="316" x2="1100" y2="310"/>
    <line x1="1140" y1="316" x2="1140" y2="310"/>
  </g>

  <!-- spy-scope motif -->
  <circle cx="1040" cy="100" r="95" fill="url(#glow)"/>
  <g stroke="#67e8f9" stroke-opacity="0.20" fill="none" stroke-width="1.5">
    <circle cx="1040" cy="100" r="95"/>
    <circle cx="1040" cy="100" r="65"/>
    <circle cx="1040" cy="100" r="35"/>
  </g>
  <g stroke="#a78bfa" stroke-opacity="0.26" stroke-width="1.5">
    <line x1="980" y1="100" x2="1015" y2="100"/>
    <line x1="1065" y1="100" x2="1100" y2="100"/>
    <line x1="1040" y1="40" x2="1040" y2="75"/>
    <line x1="1040" y1="125" x2="1040" y2="160"/>
  </g>

  <!-- distributed-replica node mesh (Paxos quorum) -->
  <g stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.4">
    <line x1="800" y1="70" x2="880" y2="50"/>
    <line x1="880" y1="50" x2="860" y2="120"/>
    <line x1="860" y1="120" x2="800" y2="70"/>
    <line x1="880" y1="50" x2="940" y2="90"/>
    <line x1="860" y1="120" x2="940" y2="90"/>
  </g>
  <g>
    <circle cx="800" cy="70" r="5.5" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="880" cy="50" r="5.5" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="860" cy="120" r="5.5" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="940" cy="90" r="5.5" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <!-- wordmark, terminal-prompt style -->
  <text x="90" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="700" letter-spacing="1">
    <tspan fill="#22d3ee" opacity="0.85">&gt;_ </tspan><tspan fill="#22d3ee">spy</tspan><tspan fill="#f1f5f9">Monk</tspan>
  </text>

  <!-- tagline -->
  <text x="93" y="180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" fill="#94a3b8">
    A distributed SQL engine and analytical warehouse, built from first principles
  </text>

  <!-- tech-stack badges: real pictograms, not text-only chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e2e8f0">

    <!-- Python: two interlocking blocks with "eye" cutouts -->
    <rect x="92" y="200" width="94" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(102,204)">
      <rect x="1" y="1" width="10" height="10" rx="3" fill="#3b82f6"/>
      <circle cx="8" cy="5" r="1.2" fill="#0b1220"/>
      <rect x="6" y="6" width="10" height="10" rx="3" fill="#fbbf24"/>
      <circle cx="10" cy="12" r="1.2" fill="#0b1220"/>
    </g>
    <text x="128" y="217" text-anchor="start">Python</text>

    <!-- TypeScript: the authentic minimal "TS" square mark -->
    <rect x="196" y="200" width="124" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(206,204)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#3178c6"/>
      <text x="9" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">TS</text>
    </g>
    <text x="234" y="217" text-anchor="start">TypeScript</text>

    <!-- Docker: simplified whale + containers -->
    <rect x="330" y="200" width="94" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(340,204)" fill="#2496ed">
      <path d="M1,13 Q2,9 7,9 H16 Q18,9 18,11 V13 Q18,15 15,15 H4 Q1,15 1,13 Z"/>
      <rect x="5" y="5" width="3" height="3"/>
      <rect x="9" y="5" width="3" height="3"/>
      <rect x="9" y="1" width="3" height="3"/>
    </g>
    <text x="366" y="217" text-anchor="start">Docker</text>

    <!-- GitHub Actions: pipeline/run icon -->
    <rect x="434" y="200" width="102" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(444,204)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
      <path d="M7,5 L13,9 L7,13 Z" fill="#a78bfa"/>
    </g>
    <text x="470" y="217" text-anchor="start">Actions</text>

    <!-- Prometheus: flame -->
    <rect x="546" y="200" width="124" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(556,204)">
      <path d="M9,1 C6,5 4,7 4,10 a5,5 0 0 0 10,0 C14,7 12,5 9,1 Z" fill="#e0663f"/>
      <path d="M9,7 C7.5,9 7,10.5 7,12 a2,2 0 0 0 4,0 c0,-1.5 -0.5,-3 -2,-5 Z" fill="#f7a072"/>
    </g>
    <text x="582" y="217" text-anchor="start">Prometheus</text>

    <!-- Grafana: dashboard gauge -->
    <rect x="680" y="200" width="102" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(690,204)">
      <path d="M2,15 A7,7 0 0 1 16,15" fill="none" stroke="#f97316" stroke-width="2"/>
      <line x1="9" y1="15" x2="13" y2="9" stroke="#f97316" stroke-width="2"/>
      <circle cx="9" cy="15" r="1.6" fill="#f97316"/>
    </g>
    <text x="716" y="217" text-anchor="start">Grafana</text>

    <!-- Loki: log lines -->
    <rect x="792" y="200" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(802,204)" fill="#7c9fd8">
      <rect x="0" y="3" width="14" height="2.2" rx="1"/>
      <rect x="0" y="8" width="10" height="2.2" rx="1"/>
      <rect x="0" y="13" width="12" height="2.2" rx="1"/>
    </g>
    <text x="828" y="217" text-anchor="start">Loki</text>
  </g>

  <!-- component chips, each with a small engineering icon -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">
    <!-- spyMonk-DB -->
    <rect x="92" y="250" width="260" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <g transform="translate(110,259)" fill="none" stroke="#22d3ee" stroke-width="1.6">
      <ellipse cx="9" cy="3" rx="8" ry="2.6"/>
      <path d="M1,3 V13 A8,2.6 0 0 0 17,13 V3"/>
      <path d="M1,8 A8,2.6 0 0 0 17,8"/>
    </g>
    <text x="132" y="273" text-anchor="start">spyMonk-DB · Spanner-DB</text>

    <!-- spyMonk-warehouse -->
    <rect x="370" y="250" width="336" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <g transform="translate(388,259)" fill="none" stroke="#a78bfa" stroke-width="1.6">
      <rect x="0" y="0" width="18" height="14" rx="2"/>
      <line x1="6" y1="0" x2="6" y2="14"/>
      <line x1="12" y1="0" x2="12" y2="14"/>
      <line x1="0" y1="7" x2="18" y2="7"/>
    </g>
    <text x="410" y="273" text-anchor="start">spyMonk-warehouse · Snowflake-inspired</text>
  </g>
</svg>
